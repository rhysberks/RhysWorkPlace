<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>RhysOverlay Chat</title>
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div class="chat-app">
    <div class="chat-header">
      <span>RhysOverlay Chat</span>
      <select id="model-select"></select>
    </div>
    <div id="messages" class="messages"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="Ask about your PC, your game, anything..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="chat.js"></script>
</body>
</html>
